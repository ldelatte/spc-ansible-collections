apiVersion: v1
kind: Pod
metadata:
  name: pk-librof
  label:
    pgm: libreoffice
spec:
  containers:
  - name: pk-librof
    image: kasmweb/libre-office:1.19.0-rolling-weekly
    imagePullPolicy: IfNotPresent
    env:
    - name: VNC_PW
      value: BpTlsEc4jT
    volumeMounts:
    - name: vn-lo-config
      mountPath: /home/kasm-user/.config
      readOnly: false
    - name: vn-lo-tele
      mountPath: /home/kasm-user/Documents
      readOnly: false
    - name: vn-lo-shm
      mountPath: /dev/shm
      readOnly: false
    # command:
    # args:
    resources:
      requests:
        mem: 100M
        cpu: 100Mi
    # livenessProbe:
    securityContext:
      runAsUser: 1000
      runAsGroup: {{ ff_user }}
      fsGroup: 0
      priviledged: False
      allowPrivilegeEscalation: False
      readOnlyRootFilesystem: False
      capabilities:
      seccompProfile:
        type:
      seLinuxOptions:
        user:
        role:
        type:
        level: "{{ se_ct_level.lo }}"
      procMount:
      sysctls:
        name:
  - name: pk-ff-tec
    image: docker.io/ldelatte/alpff:latest
    imagePullPolicy: IfNotPresent
    env:
    - name: DISPLAY
      value: ":22"
    # ports:
    volumeMounts:
    - name: vn-ffl-X11
      mountPath: /tmp/.X11-unix
      readOnly: true
    - name: vn-ffl-mozilla
      mountPath: /home/user/.mozilla
      readOnly: false
    - name: vn-ffl-cache
      mountPath: /home/user/.cache
      readOnly: false
    - name: vn-ffl-config
      mountPath: /home/user/.config
      readOnly: false
    - name: vn-ffl-fonts
      mountPath: /usr/share/fonts
      readOnly: true
    - name: vn-lo-tele
      mountPath: /home/user/Téléchargements
      readOnly: true
    command:
    - "/bin/sleep"
    - "60000"
    # args:
    resources:
      requests:
        mem: 70M
        cpu: 90Mi
    # livenessProbe:
    securityContext:
      runAsUser: 1000
      runAsGroup: {{ ff_user }}
      fsGroup: 0
      priviledged: False
      allowPrivilegeEscalation: False
      readOnlyRootFilesystem: True
      capabilities:
      seccompProfile:
        type:
      seLinuxOptions:
        user:
        role:
        type:
        level: "{{ se_ct_level.lo }}"
      procMount:
      sysctls:
        name:
  volumes:
  - name: vn-lo-config
    hostPath:
      path: {{ ansible_user_dir }}/.config/libre-office
      type: Directory
  - name: vn-lo-tele
    hostPath:
      path: {{ ansible_user_dir }}/Téléchargements/libreoffice
      type: Directory
  - name: vn-lo-shm
    emptyDir:
      sizeLimit: 500Mi
  - name: vn-ffl-X11
    hostPath:
      path: /tmp/.X11-unix
      type: Directory
  - name: vn-ffl-mozilla
    hostPath:
      path: {{ ansible_user_dir }}/.config/mozilla-lbo
      type: Directory
  - name: vn-ffl-cache
    emptyDir:
      sizeLimit: 200Mi
  - name: vn-ffl-config
    emptyDir:
      sizeLimit: 200Mi
  - name: vn-ffl-fonts
    hostPath:
      path: /usr/share/fonts
      type: Directory
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  hostNetwork: False
  hostPID: False
  hostIPC: False

